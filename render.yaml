# Render Blueprint: one free Docker web service; MongoDB runs on Atlas M0.
# No secrets are stored in the repository. Configure them in Render.
services:
  - type: web
    name: comboroute
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: REQUIRE_DEMO_AUTH
        value: "true"
      - key: DEMO_USER
        value: demo
      - key: DEMO_PASSWORD
        sync: false
      - key: MONGODB_URI
        sync: false
