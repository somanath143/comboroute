services:
  - type: web
    name: comboroute
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: REQUIRE_DEMO_AUTH
        value: 'false'
      - key: PAYMENT_MODE
        value: demo
      - key: MONGODB_URI
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: EMAIL_OTP_SECRET
        generateValue: true
      - key: MAIL_FROM
        sync: false
      # Free instances block SMTP ports 465/587. Use a verified HTTPS email sender.
      - key: EMAIL_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
