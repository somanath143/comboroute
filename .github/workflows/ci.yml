name: Verify ComboRoute JavaScript
on:
  push:
  pull_request:
jobs:
  build-and-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run test:security
      - run: npm run build
      - run: npm run test:core
      - run: npm run test -w @comboroute/core
      - run: npm run test -w @comboroute/api
      - run: npm run test -w @comboroute/web
  mongo-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w @comboroute/core
      - name: Boot disposable MongoDB replica set
        run: |
          docker run -d --name cr-mongo -p 27017:27017 mongo:7 mongod --replSet rs0 --bind_ip_all
          for n in {1..30}; do
            docker exec cr-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})' && break
            sleep 2
          done
          docker exec cr-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          sleep 6
      - name: Supertest integration suite
        env:
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017/comboroute?replicaSet=rs0&directConnection=true
        run: npm run test -w @comboroute/api
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Boot local-only SMTP test inbox
        run: docker run -d --name cr-mailpit -p 127.0.0.1:1025:1025 -p 127.0.0.1:8025:8025 axllent/mailpit:v1.27
      - name: Start disposable browser test app
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/comboroute_browser_ci?replicaSet=rs0&directConnection=true
          PAYMENT_MODE: demo
          REQUIRE_DEMO_AUTH: "false"
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: "1025"
          SMTP_ALLOW_INSECURE_LOCAL: "true"
          MAIL_FROM: signup@example.test
          EMAIL_OTP_SECRET: isolated-ci-fixture-otp-secret-over-32-characters
          BOOTSTRAP_ADMIN_EMAIL: admin.browser@example.test
          BOOTSTRAP_ADMIN_PASSWORD: browser-fixture-password-123
          BOOTSTRAP_PARTNER_EMAIL: partner.browser@example.test
          BOOTSTRAP_PARTNER_PASSWORD: browser-fixture-password-123
        run: |
          node apps/api/dist/index.js > /tmp/comboroute-browser.log 2>&1 &
          for n in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/comboroute-browser.log
          exit 1
      - name: Desktop and mobile browser scenarios
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          E2E_STAFF_PASSWORD: browser-fixture-password-123
          E2E_DISTINCT_CLIENT_IPS: "true"
          MAILPIT_URL: http://127.0.0.1:8025
        run: npm run test:e2e -- --retries=0
