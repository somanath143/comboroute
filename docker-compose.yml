
services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { rs.status().ok } catch(e) { rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"mongo:27017\"}]}); 1 }' | grep -q '1'"]
      interval: 10s
      timeout: 8s
      retries: 25
      start_period: 15s

  app:
    build: .
    depends_on:
      mongo:
        condition: service_healthy

    environment:
      # MongoDB
      MONGODB_URI: mongodb://mongo:27017/comboroute?replicaSet=rs0

      # Server
      PORT: 3000
      NODE_ENV: production
      REQUIRE_DEMO_AUTH: "false"
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
      RESERVATION_TTL_MS: ${RESERVATION_TTL_MS:-600000}
      ASSIGNMENT_LEASE_MS: ${ASSIGNMENT_LEASE_MS:-300000}
      # Email OTP signup: supply real SMTP credentials privately in .env.
      EMAIL_OTP_SECRET: ${EMAIL_OTP_SECRET:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_ALLOW_INSECURE_LOCAL: ${SMTP_ALLOW_INSECURE_LOCAL:-false}

      # Razorpay Test Payments
      PAYMENT_MODE: ${PAYMENT_MODE:-demo}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}

      # Admin account
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}

      # Restaurant account
      BOOTSTRAP_RESTAURANT_EMAIL: ${BOOTSTRAP_RESTAURANT_EMAIL:-}
      BOOTSTRAP_RESTAURANT_PASSWORD: ${BOOTSTRAP_RESTAURANT_PASSWORD:-}
      BOOTSTRAP_RESTAURANT_RESTAURANT_IDS: ${BOOTSTRAP_RESTAURANT_RESTAURANT_IDS:-1}

      # Delivery partner account
      BOOTSTRAP_PARTNER_EMAIL: ${BOOTSTRAP_PARTNER_EMAIL:-}
      BOOTSTRAP_PARTNER_PASSWORD: ${BOOTSTRAP_PARTNER_PASSWORD:-}

    ports:
      - "3000:3000"

  mailpit:
    image: axllent/mailpit:v1.27
    profiles: ["mail-test"]
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  mongo_data:
