services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes: ["mongo_data:/data/db"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { rs.status().ok } catch(e) { rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"mongo:27017\"}]}); 1 }' | grep -q '1'"]
      interval: 10s
      timeout: 8s
      retries: 25
      start_period: 15s
  app:
    build: .
    depends_on:
      mongo: { condition: service_healthy }
    environment:
      MONGODB_URI: mongodb://mongo:27017/comboroute?replicaSet=rs0
      PORT: 3000
      NODE_ENV: production
      REQUIRE_DEMO_AUTH: "true"
      DEMO_USER: ${DEMO_USER:-demo}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set a strong DEMO_PASSWORD in the root .env}
    ports: ["3000:3000"]
volumes:
  mongo_data:
